# Spectro Alerts configuration. Edit thresholds here; no code changes needed.

site:
  name: Tomball, TX
  lat: 30.0972        # degrees north
  lon: -95.6161       # degrees east (negative = west)
  height_m: 50
  timezone: America/Chicago

filters:
  mag_max: 10.0             # practical StarEx LR limit (V); adjustable 8-12
  watch_margin: 2.0         # objects up to mag_max + this go on the watch list
  min_alt_deg: 20           # backyard horizon
  min_hours: 1.0            # minimum continuous time above min_alt in darkness tonight
  sun_alt_max_deg: -12      # nautical twilight: fine for V<=10 spectra
  moon_min_sep_deg: 30      # warning only, never excludes a target
  match_radius_arcsec: 5    # positions closer than this are the same object

sources:
  cbat_tocp:
    enabled: true
    url: http://cbat.eps.harvard.edu/unconf/tocp.html   # plain http: https redirects back
    max_age_days: 30
    prefixes: [PNV, TCP]    # PSN skipped: TNS covers supernovae
    fetch_followups: true   # read follow-up pages for objects that pass the filters
    max_followups: 10
  tns:
    enabled: false          # TNS blocks GitHub's servers; Rochester + Mukai stand in (2026-10-15)
    lookback_days: 30
    disc_mag_max: 15.0      # discovery magnitude cut before visibility filtering
  rochester:                # bright supernovae + extragalactic novae, with latest magnitudes
    enabled: true
    url: https://www.rochesterastronomy.org/snimages/snactive.html
    max_age_days: 30        # skip objects not observed for this long
  mukai:                    # confirmed galactic novae, incl. TNS-only ones
    enabled: true
    url: https://asd.gsfc.nasa.gov/Koji.Mukai/novae/novae.html
    lookback_days: 30       # by discovery date, same window as CBAT
  atel:
    enabled: true
    url: https://www.astronomerstelegram.org/?rss
    lookback_days: 7

weather:
  enabled: true
  window: sunset to midnight local     # informational; the code uses this window
  max_cloud_pct: 20         # effective cloud (low + mid full weight, high at high_cloud_weight)
  high_cloud_weight: 0.5    # thin high cloud dims a spectrum less than low cloud
  max_rain_pct: 10          # precipitation probability
  max_gust_mph: 15
  min_clear_hours: 1        # continuous clear hours needed for GO
  seven_timer: true         # second opinion plus seeing/transparency

output:
  docs_dir: docs            # published by GitHub Pages
  state_file: state/objects.json
  state_keep_days: 90
