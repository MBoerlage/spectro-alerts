name: Daily alert run

on:
  schedule:
    # 20:30 UTC = 15:30 CDT in summer, 14:30 CST in winter: the email lands before dusk
    # either way, so no change is needed when Daylight Saving Time ends.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the digest"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q

      - name: Collect, match and filter
        run: python -m spectro_alerts.run

      - name: Commit results
        run: |
          git config user.name "spectro-alerts bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Email the digest
        # Scheduled runs always send; manual runs send unless the box is unticked.
        if: github.event_name == 'schedule' || inputs.send_email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m spectro_alerts.mailer
